name: infra
on:
  pull_request:
    paths: ['infra/**', 'modules/**', '.github/workflows/infra.yml']
  workflow_dispatch:

# No AWS credentials are assumed here, deliberately.
#
# This workflow used to run `terraform plan` against the live account via the
# myapp-infra-plan OIDC role. Making that work took four attempts: state access,
# lock-table write, account-wide read, and finally Kubernetes read for the Helm
# provider's drift queries. The last of those requires secretsmanager:GetSecretValue,
# because random_password results live in state and plan has to read them back.
#
# That means any PR author could have read the database password out of the tfplan
# artifact — and this repository is public. Granting it was not worth a read-only
# plan gate.
#
# So: fmt and validate here, plan locally before you apply. Infrastructure is
# changed by `terraform apply` from a workstation with your own credentials, never
# from Actions.

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false

      # Providers are cached by the .tf files, which change whenever a version
      # constraint does. The committed .terraform.lock.hcl is what actually pins
      # the resolved versions.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.terraform.d
          key: tfproviders-${{ runner.os }}-${{ hashFiles('infra/**/*.tf') }}
          restore-keys: tfproviders-

      # No backend: init -backend=false resolves providers without contacting S3,
      # which is what lets this run with no AWS credentials at all.
      - run: terraform init -backend=false
        working-directory: infra/envs/dev

      # -recursive with no path walks UP the tree, so from infra/envs/dev it also
      # covers ../../modules. That is deliberate: it is how the unformatted module
      # files were caught.
      - run: terraform fmt -check -recursive

      - run: terraform validate
        working-directory: infra/envs/dev